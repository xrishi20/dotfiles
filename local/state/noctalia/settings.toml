config_version = 13

[bar.default]
background_opacity = 0.39999999105930328
end = [ "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "notifications" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
scale = 1.2000000104308128
start = [ "launcher", "workspaces", "active_window", "media" ]
thickness = 44
widget_spacing = 16

[brightness]
enable_ddcutil = true
sync_all_monitors = true

[control_center]
sidebar = "full"
sidebar_section = "full"
width = 920

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
auto_locate = true

[lockscreen]
tint_intensity = 0.099999997764825821

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-3", "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 70.0
    box_width = 400.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "compact"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 256.0
    box_width = 816.0
    cx = 1280.0
    cy = 288.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        clock_style = "digital"
        font_family = ""
        format = "{:%I:%M %p}"
        shadow = false

[plugins]
enabled = []

[shell]
password_style = "random"
polkit_agent = true
show_location = false

    [shell.launcher]
    app_grid = true
    categories = false
    show_app_actions = true

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

[theme]
builtin = "Tokyo-Night"
community_palette = "Vesper"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-fruit-salad"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "zed", "fastfetch", "papirus-icons" ]

[weather]
effects = false
refresh_minutes = 60

[widget.active_window]
max_length = 200

[widget.clock]
format = "{:%d %B, %Y | %A, %I:%M %p}"

    [widget.clock.actions]
    left = "panel-toggle control-center"
    right = "panel-toggle control-center calendar"

[widget.media]
hide_when_no_media = true
max_length = 180

[widget.workspaces]
show_labels = false
